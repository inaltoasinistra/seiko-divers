<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Catalog</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── IMAGE CONVENTION ──────────────────────────────────────────────────────────
    // images/<ref>/front.jpg|png|webp   — front / dial view  (required)
    // images/<ref>/profile.jpg|png|webp — side profile view  (optional)
    // <ref> = reference number lowercased, e.g. images/spb381/front.jpg
    function imgPath(wref, view) {
      return `images/${wref}/${view}`;
    }

    function wrColor(wr) {
      if (wr >= 600) return "#e879f9";
      if (wr >= 300) return "#4ade80";
      return "#60a5fa";
    }

    // ── SHARED COMPONENTS ─────────────────────────────────────────────────────────

    const EXTS = ["jpg", "png", "webp"];
    function WatchImg({ src, alt, style }) {
      const [extIdx, setExtIdx] = useState(0);
      useEffect(() => { setExtIdx(0); }, [src]);
      if (extIdx >= EXTS.length) return (
        <div style={{ ...style, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#111", color: "#333", gap: 4, fontSize: "0.6rem", letterSpacing: "0.05em" }}>
          <span style={{ fontSize: "1.6rem" }}>⌚</span>
          <span>N/D</span>
        </div>
      );
      return <img src={`${src}.${EXTS[extIdx]}`} alt={alt} onError={() => setExtIdx(i => i + 1)} style={style} />;
    }

    function WatchThumbnail({ wref, name, onClick }) {
      return (
        <div style={{ display: "flex", gap: 8 }}>
          {["front", "profile"].map(view => (
            <div key={view}
              onClick={() => onClick(view)}
              style={{ width: 350, height: 350, borderRadius: 10, border: "1px solid #2a2a3a", overflow: "hidden", cursor: "zoom-in", background: "#111", flexShrink: 0, transition: "border-color .15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = "#c9a84c"}
              onMouseLeave={e => e.currentTarget.style.borderColor = "#2a2a3a"}
            >
              <WatchImg src={imgPath(wref, view)} alt={`${name} — ${view}`} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            </div>
          ))}
        </div>
      );
    }

    function Pill({ active, onClick, children, activeColor = "#c9a84c", activeTextColor = "#000" }) {
      return (
        <button onClick={onClick} style={{
          background: active ? activeColor : "#1a1a25",
          border: `1px solid ${active ? activeColor : "#333"}`,
          color: active ? activeTextColor : "#aaa",
          fontWeight: active ? 700 : 400,
          padding: "0.35rem 0.9rem", borderRadius: 20, cursor: "pointer", fontSize: "0.8rem"
        }}>{children}</button>
      );
    }

    // ── GLOBAL FILTER DEFINITIONS ─────────────────────────────────────────────────

    const WR_OPTIONS = [
      { id: "all", label: "All WR" },
      { id: "200",  label: "200m+" },
      { id: "300",  label: "300m+" },
      { id: "600",  label: "600m+" },
    ];

    const DIAMETER_OPTIONS = [
      { id: "all",   label: "All sizes" },
      { id: "lt40",  label: "< 40mm" },
      { id: "40-44", label: "40–44mm" },
      { id: "gt44",  label: "> 44mm" },
    ];

    function applyFilters(watches, cat, filters) {
      return watches
        .filter(w => cat === "all" || w.cat === cat)
        .filter(w => !filters.gmt || w.gmt)
        .filter(w => filters.wr === "all" || w.water_resistance >= parseInt(filters.wr))
        .filter(w => {
          switch (filters.diameter) {
            case "lt40":  return w.diameter < 40;
            case "40-44": return w.diameter >= 40 && w.diameter <= 44;
            case "gt44":  return w.diameter > 44;
            default:      return true;
          }
        });
    }

    // ── APP ───────────────────────────────────────────────────────────────────────

    function App() {
      const [collections, setCollections] = useState([]);   // all loaded collection objects
      const [collectionId, setCollectionId] = useState(null);
      const [cat, setCat] = useState("all");
      const [filters, setFilters] = useState({ gmt: false, wr: "all", diameter: "all" });
      const [modal, setModal] = useState(null);
      const [error, setError] = useState(null);

      // Load the file list, then fetch every collection file in parallel
      useEffect(() => {
        fetch("data/collections.json")
          .then(r => r.json())
          .then(files => Promise.all(
            files.map(file => fetch(file).then(r => r.json()).then(data => ({ ...data, _file: file })))
          ))
          .then(loaded => {
            setCollections(loaded);
            if (loaded.length > 0) setCollectionId(loaded[0].id);
          })
          .catch(err => setError(err.message || "Could not load collections"));
      }, []);

      const collection = collections.find(c => c.id === collectionId) ?? null;

      const handleCollectionChange = id => {
        setCollectionId(id);
        setCat("all");
      };

      if (error) return (
        <div style={{ background: "#0a0a0f", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#e55", fontFamily: "monospace", fontSize: "0.9rem" }}>
          {error}
        </div>
      );

      if (!collection) return (
        <div style={{ background: "#0a0a0f", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#444", fontFamily: "monospace" }}>
          Loading…
        </div>
      );

      const filtered = applyFilters(collection.watches, cat, filters);
      const rows = filtered.flatMap(w => w.refs.map(r => ({ ...w, wref: r.toLowerCase() })));

      return (
        <div style={{ background: "#0a0a0f", minHeight: "100vh", padding: "2rem 1rem", fontFamily: "'Segoe UI',system-ui,sans-serif", color: "#e8e8e8" }}>

          {/* Collection selector — only shown when more than one collection exists */}
          {collections.length > 1 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem", justifyContent: "center", marginBottom: "1.5rem" }}>
              {collections.map(c => (
                <Pill key={c.id} active={collectionId === c.id} onClick={() => handleCollectionChange(c.id)}>{c.name}</Pill>
              ))}
            </div>
          )}

          {/* Header */}
          <div style={{ textAlign: "center", marginBottom: "2rem" }}>
            <h1 style={{ fontSize: "1.8rem", fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "#fff" }}>
              {collection.name}
            </h1>
            {collection.subtitle && (
              <p style={{ color: "#555", fontSize: "0.78rem", marginTop: "0.4rem" }}>{collection.subtitle}</p>
            )}
          </div>

          {/* Category filter */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem", justifyContent: "center", marginBottom: "0.8rem" }}>
            {collection.categories.map(c => (
              <Pill key={c.id} active={cat === c.id} onClick={() => setCat(c.id)}>{c.label}</Pill>
            ))}
          </div>

          {/* Global filters */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: "1.2rem", justifyContent: "center", alignItems: "center", marginBottom: "1.8rem" }}>
            <Pill active={filters.gmt} onClick={() => setFilters(f => ({ ...f, gmt: !f.gmt }))} activeColor="#6366f1" activeTextColor="#fff">GMT</Pill>
            <div style={{ display: "flex", gap: "0.4rem" }}>
              {WR_OPTIONS.map(o => (
                <Pill key={o.id} active={filters.wr === o.id} onClick={() => setFilters(f => ({ ...f, wr: o.id }))}>{o.label}</Pill>
              ))}
            </div>
            <div style={{ display: "flex", gap: "0.4rem" }}>
              {DIAMETER_OPTIONS.map(o => (
                <Pill key={o.id} active={filters.diameter === o.id} onClick={() => setFilters(f => ({ ...f, diameter: o.id }))}>{o.label}</Pill>
              ))}
            </div>
          </div>

          {/* Table */}
          <div style={{ overflowX: "auto", borderRadius: 12, border: "1px solid #1e1e2a" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 1100 }}>
              <thead>
                <tr style={{ background: "#111118", borderBottom: "1px solid #2a2a3a" }}>
                  {["#", "Model", "Reference", "Photo", "Specs", "Price"].map(h => (
                    <th key={h} style={{ padding: "0.85rem 0.9rem", textAlign: "left", fontSize: "0.68rem", textTransform: "uppercase", letterSpacing: "0.1em", color: "#c9a84c", fontWeight: 600, whiteSpace: "nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((w, i) => {
                  const color = wrColor(w.water_resistance);
                  return (
                    <tr key={w.wref} style={{ borderBottom: "1px solid #14141e" }}
                      onMouseOver={e => e.currentTarget.style.background = "#0d0d16"}
                      onMouseOut={e => e.currentTarget.style.background = "transparent"}
                    >
                      <td style={{ padding: "0.85rem 0.9rem", color: "#333", fontSize: "0.72rem", fontFamily: "monospace" }}>
                        {String(i + 1).padStart(2, "0")}
                      </td>
                      <td style={{ padding: "0.85rem 0.9rem", minWidth: 165 }}>
                        <div style={{ fontWeight: 700, fontSize: "0.86rem", color: "#eee" }}>{w.name}</div>
                        <div style={{ fontSize: "0.7rem", color: "#777", marginTop: "0.2rem" }}>{w.sub}</div>
                        <div style={{ marginTop: "0.3rem", display: "flex", gap: "0.3rem", flexWrap: "wrap" }}>
                          <span style={{ fontSize: "0.62rem", padding: "0.08rem 0.4rem", borderRadius: 10, fontWeight: 700, color, background: color + "15", border: `1px solid ${color}33` }}>
                            {w.water_resistance}m
                          </span>
                          {w.gmt && (
                            <span style={{ fontSize: "0.62rem", padding: "0.08rem 0.4rem", borderRadius: 10, fontWeight: 700, color: "#a5b4fc", background: "#a5b4fc15", border: "1px solid #a5b4fc33" }}>
                              GMT
                            </span>
                          )}
                        </div>
                      </td>
                      <td style={{ padding: "0.85rem 0.9rem", minWidth: 115 }}>
                        <span style={{ display: "inline-block", fontFamily: "monospace", fontSize: "0.7rem", color: "#c9a84c", background: "#1a160a", padding: "0.1rem 0.4rem", borderRadius: 4, border: "1px solid #33280e", whiteSpace: "nowrap" }}>
                          {w.wref.toUpperCase()}
                        </span>
                      </td>
                      <td style={{ padding: "0.85rem 0.9rem" }}>
                        <WatchThumbnail wref={w.wref} name={w.name} onClick={view => setModal({ wref: w.wref, name: w.name, view })} />
                      </td>
                      <td style={{ padding: "0.85rem 0.9rem", fontSize: "0.7rem", color: "#888", lineHeight: 1.9, minWidth: 135 }}>
                        {w.sub.split("·").map((s, si) => (
                          <div key={si}><span style={{ color: "#333" }}>▸</span> {s.trim()}</div>
                        ))}
                      </td>
                      <td style={{ padding: "0.85rem 0.9rem", minWidth: 100 }}>
                        <div style={{ fontWeight: 800, fontSize: "1rem", color: "#c9a84c", fontFamily: "monospace", letterSpacing: "-0.02em" }}>{w.price}</div>
                        {w.priceNote && (
                          <div style={{ fontSize: "0.65rem", color: "#555", marginTop: "0.3rem", lineHeight: 1.5, whiteSpace: "pre-line" }}>{w.priceNote}</div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <p style={{ textAlign: "center", color: "#333", fontSize: "0.7rem", marginTop: "1rem" }}>
            {rows.length} references · click images to enlarge
          </p>

          {modal && (
            <div onClick={() => setModal(null)}
              style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.97)", zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center", padding: "3rem" }}>
              <button onClick={() => setModal(null)}
                style={{ position: "fixed", top: "1rem", right: "1rem", background: "#c9a84c", color: "#000", border: "none", width: 36, height: 36, borderRadius: "50%", fontSize: "1.1rem", cursor: "pointer", fontWeight: 700, zIndex: 1 }}>✕</button>
              <WatchImg
                src={imgPath(modal.wref, modal.view)}
                alt={`${modal.name} — ${modal.view}`}
                style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain", borderRadius: 8 }}
              />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
